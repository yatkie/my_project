
[package]
name = "my_project"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpassword = "7"

solana-client = "3.0"
solana-sdk = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-program-pack = "3.0"
spl-token = { version = "9.0", features = ["no-entrypoint"] }
spl-associated-token-account = "8.0"

bcrypt = "0.19.3"
aes-gcm = "0.10"
hex = "0.4"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
signature = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

# Release profile: hardening against reverse engineering
[profile.release]
opt-level = 3
strip = true
debug = 0
lto = true
codegen-units = 1
panic = "abort"
