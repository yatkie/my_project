[package]
name = "my_project"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpassword = "7"

solana-client = "2.1"
solana-sdk = "2.1"
solana-system-interface = { version = "1.0", features = ["bincode"] }
spl-token = "7"
spl-associated-token-account = "6"
solana-program-pack = "2"
bcrypt = "0.19.3"
aes-gcm = "0.10"
hex = "0.4"