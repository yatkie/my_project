
[package]
name = "my_project"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpassword = "7"

solana-client = "3.0"
solana-sdk = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-program-pack = "3.0"
